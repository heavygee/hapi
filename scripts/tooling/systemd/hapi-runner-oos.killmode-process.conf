# Install:
#   sudo mkdir -p /etc/systemd/system/hapi-runner-oos.service.d
#   sudo cp scripts/tooling/systemd/hapi-runner-oos.killmode-process.conf \
#        /etc/systemd/system/hapi-runner-oos.service.d/killmode-process.conf
#   sudo systemctl daemon-reload
# Do NOT restart the runner immediately after installing if KillMode was
# previously control-group — that stop still massacres the cgroup. The NEXT
# stop after daemon-reload uses KillMode=process.
#
# Upstream: tiann/hapi#915 (closed by PR #928 docs). Local units still had
# KillMode=control-group as of 2026-07-24; every soup rematerialize +
# hapi-restart-hub was cascade-archiving the idle fleet.

[Service]
KillMode=process
