name: Test

on:
    push:
    pull_request:

# heavygee/hapi: prefer oos-linux self-hosted (`hapi` label) so we do not burn
# GitHub-hosted minutes. Upstream / other forks keep ubuntu-latest.
# Runner: actions.runner.heavygee-hapi.oos-linux-hapi-ci.service
# See docs/tooling/local-ci.md and server-setup runbook github-self-hosted-runners.md.

jobs:
    test:
        runs-on: ${{ github.repository_owner == 'heavygee' && fromJSON('["self-hosted","Linux","X64","hapi"]') || 'ubuntu-latest' }}
        steps:
            - uses: actions/checkout@v4
            - name: Test PR review automation
              run: node --test .github/scripts/pr-review.test.cjs
            - uses: oven-sh/setup-bun@v2
            - run: bun install --frozen-lockfile
            - run: bun typecheck
            - run: bunx playwright install --with-deps chromium
            # Required by cli/src/utils/windowsProcessTree.pwsh.test.ts — image
            # inspect alone does not pull; silent skip was fake B1 coverage (#1911).
            - run: docker pull mcr.microsoft.com/powershell:latest
            - run: bun run test:e2e -- terminal-wrap-fidelity.spec.ts composer-copy.spec.ts session-list-scroll.spec.ts cold-initial-tail.spec.ts scrollbar-auto-hide.spec.ts attachment-removal.spec.ts history-navigation-layout.spec.ts
            # Fork: cli tests run through the flaky-quarantine gate (same
            # script the local remat gate uses — config/flaky-quarantine.yaml
            # is fork-only data, see docs/tooling/flaky-quarantine.md).
            # Upstream/other forks: unchanged plain `bun run test`.
            - name: Run tests
              run: |
                  if [[ "${{ github.repository_owner }}" == "heavygee" ]]; then
                      bash scripts/tooling/flaky-quarantine-gate.sh "$PWD"
                  else
                      bun run test
                  fi
            # Fork has no windows-latest budget; cover the same file on Linux.
            - name: Codex MCP proxy unit (Linux stand-in for windows-codex-mcp)
              if: github.repository_owner == 'heavygee'
              run: bun run --cwd cli test -- src/codex/utils/codexMcpProxy.test.ts

    # Serial runner-integration suite: starts real detached runner/session
    # process trees against an isolated temp hub, so it runs in its own job
    # (never in the parallel unit-test path). See cli/vitest.integration.config.ts.
    integration:
        runs-on: ${{ github.repository_owner == 'heavygee' && fromJSON('["self-hosted","Linux","X64","hapi"]') || 'ubuntu-latest' }}
        steps:
            - uses: actions/checkout@v4
            - uses: oven-sh/setup-bun@v2
            - run: bun install --frozen-lockfile
            - run: bun run test:cli:integration

    # Hosted Windows minutes — skip on the heavygee fork (covered above on Linux).
    windows-codex-mcp:
        if: github.repository_owner != 'heavygee'
        runs-on: windows-latest
        steps:
            - uses: actions/checkout@v4
            - uses: oven-sh/setup-bun@v2
            - run: bun install --frozen-lockfile
            - run: bun run --cwd cli test -- src/codex/utils/codexMcpProxy.test.ts
