name: Claude PR review (Codex quota fallback)

# NOT a replacement for the chatgpt-codex-connector review (the operator's
# ChatGPT Codex Cloud SaaS review — see docs/tooling/pr-review-loop.md). A
# fallback for when that connector CANNOT run: it has its own usage-limit
# ceiling, and this estate's rule (scripts/tooling/hapi-pr-status.sh) treats
# a quota message with no tip-matched review as a hard FAIL — nobody should
# have to sit on a ready diff waiting for SaaS quota to refill when a Claude
# Code subscription is sitting right here on the same self-hosted runner.
#
# Triggers ONLY on the connector's OWN comment/review — the job condition
# checks the AUTHENTICATED bot login, which a human or external PR author
# cannot spoof by just typing the usage-limit phrase into a comment — AND
# only when that body matches the exact usage-limit phrasing
# hapi-pr-status.sh already matches. Does not run on every PR; does not
# replace Codex when Codex is working. See
# docs/tooling/claude-codex-fallback-review.md.
#
# Off by default until the CLAUDE_REVIEW_ENABLED repo variable is 'true' AND
# the CLAUDE_CODE_OAUTH_TOKEN repo secret is set — same safe-rollout pattern
# as lockhouse/setup's claude-pr-review-reusable.yml, the reference this was
# ported from (see that repo's docs/operator/claude-pr-review-runners.md for
# the `claude setup-token` provisioning flow).

on:
    issue_comment:
        types: [created]
    pull_request_review:
        types: [submitted]

concurrency:
    group: claude-fallback-review-${{ github.event.issue.number || github.event.pull_request.number }}
    cancel-in-progress: true

jobs:
    maybe-review:
        if: |
            github.repository_owner == 'heavygee' &&
            vars.CLAUDE_REVIEW_ENABLED == 'true' &&
            (
              (github.event_name == 'issue_comment' && github.event.issue.pull_request && github.event.comment.user.type == 'Bot' && (github.event.comment.user.login == 'chatgpt-codex-connector[bot]' || github.event.comment.user.login == 'chatgpt-codex-connector')) ||
              (github.event_name == 'pull_request_review' && github.event.review.user.type == 'Bot' && (github.event.review.user.login == 'chatgpt-codex-connector[bot]' || github.event.review.user.login == 'chatgpt-codex-connector'))
            )
        runs-on: [self-hosted, Linux, X64, hapi]
        timeout-minutes: 45
        permissions:
            contents: read
            pull-requests: write
            issues: write
            id-token: write
            actions: read
        steps:
            - name: Gate — confirm this is a quota message, and we haven't already covered this tip
              id: gate
              env:
                  GH_TOKEN: ${{ github.token }}
                  EVENT_NAME: ${{ github.event_name }}
                  COMMENT_BODY: ${{ github.event.comment.body }}
                  REVIEW_BODY: ${{ github.event.review.body }}
                  PR_NUMBER: ${{ github.event.issue.number || github.event.pull_request.number }}
                  REPO: ${{ github.repository }}
              run: |
                  # Deliberately NOT `set -e`: a transient gh-api hiccup here must
                  # degrade to "skip this run" (run=false), not a job failure —
                  # this gate step feeding a hard failure into a workflow whose
                  # whole design goal is "never a new false red X" (cold review,
                  # 2026-10-15) would be exactly the incident it exists to avoid.
                  set -uo pipefail
                  BODY="$COMMENT_BODY"
                  if [[ "$EVENT_NAME" == "pull_request_review" ]]; then BODY="$REVIEW_BODY"; fi

                  # Same phrase hapi-pr-status.sh matches (scripts/tooling/hapi-pr-status.sh)
                  # — one detection pattern, not two that can drift apart.
                  if ! printf '%s' "$BODY" | grep -qiE 'usage limits for code reviews|Codex usage limits'; then
                      echo "run=false" >>"$GITHUB_OUTPUT"
                      echo "Not a Codex usage-limit message — skipping."
                      exit 0
                  fi

                  HEAD_SHA="$(gh pr view "$PR_NUMBER" --repo "$REPO" --json headRefOid --jq .headRefOid 2>/dev/null)"
                  if [[ -z "$HEAD_SHA" ]]; then
                      echo "run=false" >>"$GITHUB_OUTPUT"
                      echo "Could not resolve PR #$PR_NUMBER head SHA (transient API error?) — skipping rather than failing the job."
                      exit 0
                  fi

                  # Don't re-review a tip Claude already covered — the usage-limit
                  # comment can repeat on later pushes/retries before Codex quota
                  # resets, and this job's own review would otherwise pile up.
                  ALREADY=$(gh api "repos/$REPO/pulls/$PR_NUMBER/reviews" --paginate 2>/dev/null \
                      | jq --arg sha "${HEAD_SHA:0:12}" \
                          '[.[] | select(.user.login == "github-actions[bot]"
                              and ((.body // "") | test("Claude Fallback Review"; "i"))
                              and ((.body // "") | contains($sha)))] | length' 2>/dev/null || echo 0)
                  if [[ "${ALREADY:-0}" -gt 0 ]]; then
                      echo "run=false" >>"$GITHUB_OUTPUT"
                      echo "Claude already reviewed tip $HEAD_SHA on PR #$PR_NUMBER — skipping duplicate."
                      exit 0
                  fi

                  {
                      echo "run=true"
                      echo "pr_number=$PR_NUMBER"
                      echo "head_sha=$HEAD_SHA"
                  } >>"$GITHUB_OUTPUT"
                  echo "Codex usage-limit detected on PR #$PR_NUMBER at tip ${HEAD_SHA:0:12} — running Claude fallback review."

            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 — same pin as lockhouse/arthur
              if: steps.gate.outputs.run == 'true'
              with:
                  ref: refs/pull/${{ steps.gate.outputs.pr_number }}/head
                  fetch-depth: 0

            # ADVISORY, NOT A GATE (matches lockhouse/arthur's claude-review.yml,
            # 2026-09-24 incident: an org secret lapsing there turned a reviewer
            # into a standing red X on every PR for reasons unrelated to the
            # diff). A fallback reviewer that can itself fail for credential
            # reasons must never be able to block a merge — see the explicit
            # "did it actually run" report step below instead.
            - name: Claude fallback review
              id: claude_review
              if: steps.gate.outputs.run == 'true'
              continue-on-error: true
              uses: anthropics/claude-code-action@653c70eb8a3e02371eabde8cc38849ae54ce6a19 # v1 — same pin as lockhouse/arthur
              env:
                  # bun (the action's own runtime) needs this SET on a
                  # self-hosted runner or its install dies with "unable to
                  # write files to tempdir: FileNotFound" — same fix as
                  # lockhouse/arthur's claude-review.yml.
                  XDG_CACHE_HOME: ${{ runner.temp }}/bun-cache
              with:
                  claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
                  github_token: ${{ github.token }}
                  track_progress: true
                  prompt: |
                      REPO: ${{ github.repository }}
                      PR NUMBER: ${{ steps.gate.outputs.pr_number }}

                      You are running as a FALLBACK reviewer because the ChatGPT
                      Codex Cloud connector that normally reviews this PR is out
                      of quota. Start your formal review body with this exact
                      line so repeat runs can detect they already covered this
                      tip:
                      Claude Fallback Review — reviewed commit: ${{ steps.gate.outputs.head_sha }}

                      Review this pull request for heavygee/hapi, a fork of
                      tiann/hapi (terminal coding-agent session manager).

                      Base focus:
                      1. Correctness — logic bugs, edge cases, regressions
                      2. Security — injection, auth, secrets, unsafe defaults
                      3. Tests — meaningful coverage for changed behavior
                      4. Scope — minimal diff; flag unrelated churn

                      Read AGENTS.md and docs/operator/AGENTS.md when present for
                      project conventions. Post inline comments on specific
                      lines. Submit a formal pull request review (COMMENT or
                      REQUEST_CHANGES) with a summary. Do not APPROVE or merge.
                  # Narrower than lockhouse/arthur's allowedTools (cold review,
                  # 2026-10-15): arthur reviews internal/trusted PRs; this
                  # workflow exists specifically to review EXTERNAL fork PRs
                  # whose diff/comments are adversarial by assumption. Bare
                  # `Bash(gh pr*)`/`Bash(gh api*)`/`Bash(git*)` would let a
                  # prompt-injection in the reviewed content reach `gh pr merge`,
                  # `gh pr close`, `gh pr edit`, or an arbitrary `gh api` call
                  # with this job's pull-requests:write token. The prompt's "do
                  # not approve/merge" instruction is the only defense for
                  # whatever's still reachable through `gh pr review:*` — this
                  # list exists to shrink that surface, not eliminate it.
                  claude_args: |
                      --max-turns 80
                      --allowedTools "Read,Glob,Grep,LS,mcp__github_inline_comment__create_inline_comment,mcp__github_comment__update_claude_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh pr review:*)"

            # Says plainly which of the two happened: "did not run" and "found
            # nothing" are different facts, and continue-on-error above means
            # the job's own colour can no longer tell them apart.
            - name: Report whether the review actually ran
              if: always() && steps.gate.outputs.run == 'true'
              run: |
                  if [[ '${{ steps.claude_review.outcome }}' == 'success' ]]; then
                      echo "Claude fallback review completed." >>"$GITHUB_STEP_SUMMARY"
                  else
                      {
                          echo "### :warning: The Claude fallback review did NOT run"
                          echo
                          echo "Outcome: \`${{ steps.claude_review.outcome }}\`. This job is advisory and"
                          echo "does not block merges. **Nothing here says the diff is fine** — Codex is"
                          echo "out of quota AND this fallback also failed to produce a review."
                          echo
                          echo "Most likely CLAUDE_CODE_OAUTH_TOKEN has lapsed (tied to a Claude Code"
                          echo "account; re-run \`claude setup-token\` and update the repo secret)."
                      } >>"$GITHUB_STEP_SUMMARY"
                      echo "::warning title=Claude fallback review did not run::Advisory check failed (${{ steps.claude_review.outcome }}) — Codex quota-exhausted AND the fallback also failed; this PR has no automated review right now."
                  fi
