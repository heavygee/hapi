# Daily driver manifest — CANONICAL RECIPE (edit here, commit on fork main).
# Runtime mirror: ~/.config/hapi/driver-manifest.yaml via hapi-manifest-mirror-to-config.sh
# Rebuild: hapi-driver-rebuild [--build-web] [--verify] [--activate]
#
# NEVER copy ~/.config → this file (inverted sync dropped open-PR layers — see
# docs/plans/2026-08-18-overseer-brain-active-soup-drop-postmortem.md).
#
# Layer order matters. Each layer merges into driver/integration on top of base.
# Top layer = last entry in this list.
#
# Drop layers when merged to upstream/main (rebuild warns if primary main is behind upstream).
#
# DB schema:
#   The hub's SQLite store has FORWARD step-migrations only (v1 -> v2 -> ... -> N).
#   Layers that bump SCHEMA_VERSION (e.g. feat/companion-fcm-push-api v9 -> v10)
#   auto-migrate the live DB forward at hub startup. Going BACKWARDS (e.g. pure
#   upstream/main) requires hapi-driver-db-prep.sh (auto-invoked by hapi-use-worktree)
#   which knows the known reverse SQL (v10 -> v9 = drop fcm_devices + indexes).
#   Always backs up ~/.hapi/hapi.db before any change.
#
