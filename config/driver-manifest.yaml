  # heavygee/hapi#238 follow-on — PUT /external-refs (setSessionExternalRefs)
  # and remove-primary/upsert (mutateSessionExternalRefs) never actually
  # persisted a role-only demotion or an explicit removal, confirmed live on
  # soup: polled every 10s for 60s post-demotion-PUT, #238 stayed primary
  # the whole time, statusCheckedAt/linkedAt byte-identical before/after —
  # not a race with a concurrent writer, a deterministic no-op. Root cause:
  # updateSessionMetadata unconditionally re-merges prior+next via
  # mergeContributionFields/reconcileExternalRefs, which only ever adds
  # from next and, on an identity-matched tie (same linkedAt AND
  # statusCheckedAt — true for a hand-built role-only edit), keeps prior.
  # Adds an opt-in replaceExternalRefs bypass (mergeContributionFields ->
  # mergeSessionMetadata -> updateSessionMetadata), set on
  # setSessionExternalRefs's and mutateSessionExternalRefs's own calls,
  # since both already compute the full desired array from a freshly-read
  # current state. Sparse writers that don't pass it keep the existing
  # tie-keeps-prior behavior. Same pattern already shipped on feat/boards;
