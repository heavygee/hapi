  # Refetch-storm fix part B (follow-up to #885; closes tiann/hapi#884 second
  # half). Hub previously emitted no-data session-updated SSE events for the
  # four CLI emit-sites (TodoWrite landed, teamState update, update-metadata
  # RPC, update-state RPC). Web fell through getSessionPatch's "no data"
  # branch and per-session REST-invalidated, which on a 130-session install
  # becomes an O(N) refetch storm any time one session changed. This layer:
  #   - extends SessionPatchSchema (shared/) with todos/teamState/
  #     metadata{version,value}/agentState{version,value}
  #   - changes the four emit-sites to carry structured payload data so the
  #     web getSessionPatch parser hits its truthy branch and patches the
  #     React Query cache in place (no REST refetch)
  #   - adds SessionCache.applySessionPatch + SyncEngine fast-path so the hub
  #     mirrors the patch into its in-memory cache without a DB re-read
  #     (cache-coherency for NotificationHub, sidebar, etc.)
  #   - includes a dedup-by-reference fix: applySessionPatch MUTATES the
  #     cached Session in place; snapshot metadata before the call so the
  #     dedup-on-agent-session-id-change trigger still fires on the fast path.
  # No SCHEMA_VERSION bump. Pre-PR; gates green (429 hub tests pass).
  - branch: feat/sse-patch-extend-session-state

