name: Claude PR review (Codex quota fallback)

# NOT a replacement for the chatgpt-codex-connector review (the operator's
# ChatGPT Codex Cloud SaaS review — see docs/tooling/pr-review-loop.md). A
# fallback for when that connector CANNOT run: it has its own usage-limit
# ceiling, and this estate's rule (scripts/tooling/hapi-pr-status.sh) treats
# a quota message with no tip-matched review as a hard FAIL — nobody should
# have to sit on a ready diff waiting for SaaS quota to refill when a Claude
# Code subscription is sitting right here on the same self-hosted runner.
#
# Triggers ONLY on the connector's OWN comment/review — the job condition
# checks the AUTHENTICATED bot login + user.type == 'Bot', which a human or
# external PR author cannot spoof by just typing the usage-limit phrase into
# a comment — AND only when that body matches the exact usage-limit phrasing
# hapi-pr-status.sh already matches. Does not run on every PR; does not
# replace Codex when Codex is working. hapi-pr-status.sh recognizes a
# tip-matched, COMMENTED (no blocking findings) fallback review as this
# dimension's alternate PASS. See docs/tooling/claude-codex-fallback-review.md.
#
# SECURITY (cold review, 2026-10-15, citing Anthropic's own claude-code-action
# guidance on pull_request_target-class triggers): this reviews EXTERNAL,
# UNTRUSTED fork PRs. The repo's own .claude/settings.json runs
# ./scripts/tooling/hapi-claude-pretooluse-guard.sh (PreToolUse, on every
# Bash/Edit/Write/MultiEdit/NotebookEdit call Claude makes) and
# ./scripts/tooling/hapi-tooling-commit-guard.sh (PostToolUse/Stop) via
# RELATIVE path. If the untrusted PR head were checked out at the workspace
# root, an attacker's PR modifying those scripts would get them EXECUTED with
# this job's pull-requests:write credentials on the very first tool call —
# even with settings.json itself restored from the trusted base branch,
# because the hook COMMAND is trusted but the relative path it resolves
# through is not. So: the TRUSTED base branch stays at the workspace root
# (default checkout ref, which for issue_comment/pull_request_review is the
# default branch, never the PR); the untrusted PR head is checked out into
# ./pr-head/ instead (passed to Claude via --add-dir, matching Anthropic's own
# documented pull_request_target-class pattern exactly), and Claude is told
# to diff the PINNED local checkout there rather than gh pr diff (which shows
# the live, possibly-moved PR state).
#
# Off by default until the CLAUDE_REVIEW_ENABLED repo variable is 'true' AND
# the CLAUDE_CODE_OAUTH_TOKEN repo secret is set — same safe-rollout pattern
# as lockhouse/setup's claude-pr-review-reusable.yml, the reference this was
# ported from (see that repo's docs/operator/claude-pr-review-runners.md for
# the `claude setup-token` provisioning flow).

on:
    issue_comment:
        types: [created]
    pull_request_review:
        types: [submitted]

concurrency:
    group: claude-fallback-review-${{ github.event.issue.number || github.event.pull_request.number }}
    cancel-in-progress: true

jobs:
    maybe-review:
        if: |
            github.repository_owner == 'heavygee' &&
            vars.CLAUDE_REVIEW_ENABLED == 'true' &&
            (
              (github.event_name == 'issue_comment' && github.event.issue.pull_request && github.event.comment.user.type == 'Bot' && (github.event.comment.user.login == 'chatgpt-codex-connector[bot]' || github.event.comment.user.login == 'chatgpt-codex-connector')) ||
              (github.event_name == 'pull_request_review' && github.event.review.user.type == 'Bot' && (github.event.review.user.login == 'chatgpt-codex-connector[bot]' || github.event.review.user.login == 'chatgpt-codex-connector'))
            )
        runs-on: [self-hosted, Linux, X64, hapi]
        timeout-minutes: 45
        permissions:
            contents: read
            pull-requests: write
            issues: write
            id-token: write
            actions: read
        steps:
            - name: Gate — confirm this is a quota message, and we haven't already covered this tip
              id: gate
              env:
                  GH_TOKEN: ${{ github.token }}
                  EVENT_NAME: ${{ github.event_name }}
                  COMMENT_BODY: ${{ github.event.comment.body }}
                  REVIEW_BODY: ${{ github.event.review.body }}
                  PR_NUMBER: ${{ github.event.issue.number || github.event.pull_request.number }}
                  REPO: ${{ github.repository }}
              run: |
                  # Deliberately NOT `set -e`: a transient gh-api hiccup here must
                  # degrade to "skip this run" (run=false), not a job failure —
                  # this gate step feeding a hard failure into a workflow whose
                  # whole design goal is "never a new false red X" (cold review,
                  # 2026-10-15) would be exactly the incident it exists to avoid.
                  set -uo pipefail
                  BODY="$COMMENT_BODY"
                  if [[ "$EVENT_NAME" == "pull_request_review" ]]; then BODY="$REVIEW_BODY"; fi

                  # Same phrase hapi-pr-status.sh matches (scripts/tooling/hapi-pr-status.sh)
                  # — one detection pattern, not two that can drift apart.
                  if ! printf '%s' "$BODY" | grep -qiE 'usage limits for code reviews|Codex usage limits'; then
                      echo "run=false" >>"$GITHUB_OUTPUT"
                      echo "Not a Codex usage-limit message — skipping."
                      exit 0
                  fi

                  # baseRefOid alongside headRefOid: the diff Claude computes later
                  # must be against THIS PR's actual base commit, not a hardcoded
                  # main/master guess — a PR targeting a release/backport/stacked
                  # branch would otherwise review unrelated target-branch history
                  # as if it were part of the PR (cold review, 2026-10-15, fourth
                  # wave).
                  PR_JSON="$(gh pr view "$PR_NUMBER" --repo "$REPO" --json headRefOid,baseRefOid 2>/dev/null)"
                  HEAD_SHA="$(printf '%s' "$PR_JSON" | jq -r '.headRefOid // empty' 2>/dev/null)"
                  BASE_SHA="$(printf '%s' "$PR_JSON" | jq -r '.baseRefOid // empty' 2>/dev/null)"
                  if [[ -z "$HEAD_SHA" || -z "$BASE_SHA" ]]; then
                      echo "run=false" >>"$GITHUB_OUTPUT"
                      echo "Could not resolve PR #$PR_NUMBER head/base SHA (transient API error?) — skipping rather than failing the job."
                      exit 0
                  fi

                  # Fetched once, used for both the Codex-tip-match check and the
                  # Claude-dedup check below — temp files, not --argjson (PR review
                  # payloads are too large for jq --argjson argv limits, same
                  # reasoning as hapi-pr-status.sh). --paginate without --slurp
                  # emits ONE JSON ARRAY PER PAGE (not auto-concatenated) on this
                  # endpoint — the "pages" merge idiom below matches
                  # hapi-pr-status.sh rather than re-deriving it.
                  #
                  # A genuinely failed lookup must NOT fall through to run=true:
                  # treating a fetch failure as "nothing found" would launch a
                  # redundant/duplicate review on a transient API hiccup (cold
                  # review, 2026-10-15, second + fourth waves) — distinct from the
                  # earlier resolve-PR fail-soft above, which correctly degrades to
                  # SKIP, not to "assume clear to proceed".
                  REVIEWS_TMP="$(mktemp)"
                  COMMENTS_TMP="$(mktemp)"
                  trap 'rm -f "$REVIEWS_TMP" "$COMMENTS_TMP"' EXIT
                  if ! gh api "repos/$REPO/pulls/$PR_NUMBER/reviews" --paginate --slurp >"$REVIEWS_TMP" 2>/dev/null; then
                      echo "run=false" >>"$GITHUB_OUTPUT"
                      echo "Could not fetch existing reviews for PR #$PR_NUMBER (transient API error?) — skipping rather than risking a duplicate."
                      exit 0
                  fi
                  gh api "repos/$REPO/issues/$PR_NUMBER/comments" --paginate --slurp >"$COMMENTS_TMP" 2>/dev/null || echo '[]' >"$COMMENTS_TMP"

                  # If Codex itself already tip-matched this exact HEAD_SHA (a
                  # retry/repeat quota notice on a tip Codex already reviewed
                  # successfully before hitting quota on a LATER push, or any
                  # other ordering that leaves a real Codex review sitting on
                  # this commit), the fallback is redundant: hapi-pr-status.sh's
                  # fallback branch is only ever consulted when `! $TIP_MATCHED`
                  # against Codex's own review, so a fallback review here cannot
                  # change the verdict and only adds a possibly-conflicting extra
                  # thread (cold review, 2026-10-15, fourth wave). Same tip-match
                  # detection shape as hapi-pr-status.sh.
                  CODEX_REVIEWED_SHA=$(jq -n --slurpfile reviews "$REVIEWS_TMP" --slurpfile comments "$COMMENTS_TMP" '
                      def pages: if type == "array" and length > 0 and (.[0]|type) == "array" then add else . end;
                      def is_codex: (.user.login == "chatgpt-codex-connector[bot]" or .user.login == "chatgpt-codex-connector");
                      def has_reviewed_commit: ((.body // "") | test("Reviewed commit"));
                      ($reviews[0] | pages // []) as $r
                      | ($comments[0] | pages // []) as $c
                      | ([ $r[]? | select(is_codex and has_reviewed_commit) | {at:.submitted_at, body:(.body // "")} ]
                         + [ $c[]? | select(is_codex and has_reviewed_commit) | {at:.created_at, body:(.body // "")} ])
                      | sort_by(.at) | reverse | .[0].body // empty
                      ' 2>/dev/null | grep -oE 'Reviewed commit:\*\* `[0-9a-f]{7,40}`|Reviewed commit: `[0-9a-f]{7,40}`' \
                          | head -1 | grep -oE '[0-9a-f]{7,40}' | head -1)
                  if [[ -n "$CODEX_REVIEWED_SHA" && ( "$HEAD_SHA" == "$CODEX_REVIEWED_SHA"* || "$CODEX_REVIEWED_SHA" == "$HEAD_SHA"* ) ]]; then
                      echo "run=false" >>"$GITHUB_OUTPUT"
                      echo "Codex already has a tip-matched review on $HEAD_SHA — fallback would be redundant (hapi-pr-status.sh wouldn't consult it anyway)."
                      exit 0
                  fi

                  # Don't re-review a tip Claude already covered — the usage-limit
                  # comment can repeat on later pushes/retries before Codex quota
                  # resets, and this job's own review would otherwise pile up.
                  ALREADY=$(jq -n --slurpfile reviews "$REVIEWS_TMP" --arg sha "${HEAD_SHA:0:12}" '
                      def pages: if type == "array" and length > 0 and (.[0]|type) == "array" then add else . end;
                      ($reviews[0] | pages // [])
                      | [.[] | select(.user.login == "github-actions[bot]"
                          and ((.body // "") | test("Claude Fallback Review"; "i"))
                          and ((.body // "") | contains($sha)))] | length
                      ' 2>/dev/null || echo 0)
                  if [[ "${ALREADY:-0}" -gt 0 ]]; then
                      echo "run=false" >>"$GITHUB_OUTPUT"
                      echo "Claude already reviewed tip $HEAD_SHA on PR #$PR_NUMBER — skipping duplicate."
                      exit 0
                  fi

                  {
                      echo "run=true"
                      echo "pr_number=$PR_NUMBER"
                      echo "head_sha=$HEAD_SHA"
                      echo "base_sha=$BASE_SHA"
                  } >>"$GITHUB_OUTPUT"
                  echo "Codex usage-limit detected on PR #$PR_NUMBER at tip ${HEAD_SHA:0:12} — running Claude fallback review."

            # TRUSTED base at the workspace root — this is what .claude/settings.json's
            # hook relative-paths resolve against. Default ref (no `ref:` override):
            # for issue_comment/pull_request_review this is the default branch, never
            # the PR. See the file-header security note.
            - name: Checkout base (trusted) at workspace root
              id: checkout_base
              if: steps.gate.outputs.run == 'true'
              continue-on-error: true
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 — same pin as lockhouse/arthur
              with:
                  fetch-depth: 0
                  # Default true leaves the job's write-capable GITHUB_TOKEN in
                  # git config (http.extraheader) ON DISK — readable via `git
                  # config --get` regardless of CLAUDE_CODE_SUBPROCESS_ENV_SCRUB
                  # (which only scrubs env vars, not git config). Claude never
                  # needs to push here; nothing in this workflow commits.
                  persist-credentials: false

            # UNTRUSTED PR head — isolated in a subdirectory, never at the root,
            # so an attacker's modified guard/hook script is never what gets
            # executed when Claude's tool calls trigger this repo's own hooks.
            # Pinned to the exact SHA the gate resolved (not a floating
            # refs/pull/N/head, which could move between gate and checkout).
            - name: Checkout untrusted PR head into ./pr-head (isolated from hooks)
              id: checkout_head
              if: steps.gate.outputs.run == 'true' && steps.checkout_base.outcome == 'success'
              continue-on-error: true
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  ref: ${{ steps.gate.outputs.head_sha }}
                  path: pr-head
                  fetch-depth: 0
                  # Same reasoning as the base checkout above — this is the
                  # UNTRUSTED checkout; definitely don't leave a write-capable
                  # credential sitting in its on-disk git config.
                  persist-credentials: false

            # ADVISORY, NOT A GATE (matches lockhouse/arthur's claude-review.yml,
            # 2026-09-24 incident: an org secret lapsing there turned a reviewer
            # into a standing red X on every PR for reasons unrelated to the
            # diff). A fallback reviewer that can itself fail for credential
            # reasons must never be able to block a merge — see the explicit
            # "did it actually run" report step below instead.
            - name: Claude fallback review
              id: claude_review
              if: steps.gate.outputs.run == 'true' && steps.checkout_base.outcome == 'success' && steps.checkout_head.outcome == 'success'
              continue-on-error: true
              uses: anthropics/claude-code-action@653c70eb8a3e02371eabde8cc38849ae54ce6a19 # v1 — same pin as lockhouse/arthur
              env:
                  # bun (the action's own runtime) needs this SET on a
                  # self-hosted runner or its install dies with "unable to
                  # write files to tempdir: FileNotFound" — same fix as
                  # lockhouse/arthur's claude-review.yml.
                  XDG_CACHE_HOME: ${{ runner.temp }}/bun-cache
                  # claude-code-action only enables subprocess credential
                  # scrubbing (CLAUDE_CODE_OAUTH_TOKEN / GITHUB_TOKEN stripped
                  # from env before Claude's own Bash tool calls spawn) by
                  # default when allowed_non_write_users is set — this
                  # workflow doesn't use that input, but the action's own
                  # action.yml honors this var unconditionally if set here
                  # (action.yml: `env.CLAUDE_CODE_SUBPROCESS_ENV_SCRUB ||
                  # (allowed_non_write_users && '1') || ''`). Reviewing
                  # adversarial external PR content with write-capable
                  # Bash(gh pr *) tools means a prompt injection could
                  # otherwise exfiltrate either credential via something like
                  # `gh pr comment ... --body "$CLAUDE_CODE_OAUTH_TOKEN"`
                  # (cold review, 2026-10-15, second wave).
                  CLAUDE_CODE_SUBPROCESS_ENV_SCRUB: "1"
              with:
                  claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
                  github_token: ${{ github.token }}
                  # track_progress forces the action's "tag mode", which rejects
                  # bot actors by default (checkHumanActor) — every legitimate
                  # trigger here IS a bot (chatgpt-codex-connector), so that
                  # check would reject every real run, silently, under
                  # continue-on-error. Disabled; also the progress-tracking
                  # issue comment it would post is itself flagged by
                  # hapi-pr-merge-gate.sh as an unanswered non-author comment
                  # that blocks merge (cold review, 2026-10-15 — two separate
                  # bugs, one fix).
                  track_progress: false
                  # Defense in depth alongside track_progress:false, in case a
                  # future action version engages an actor check through a
                  # different path.
                  allowed_bots: "chatgpt-codex-connector"
                  prompt: |
                      REPO: ${{ github.repository }}
                      PR NUMBER: ${{ steps.gate.outputs.pr_number }}

                      You are running as a FALLBACK reviewer because the ChatGPT
                      Codex Cloud connector that normally reviews this PR is out
                      of quota. Start your formal review body with this exact
                      line so repeat runs can detect they already covered this
                      tip:
                      Claude Fallback Review — reviewed commit: ${{ steps.gate.outputs.head_sha }}

                      SECURITY: the workspace root is the TRUSTED base branch,
                      not this PR. The PR's actual (untrusted) changes are
                      checked out at ./pr-head, PINNED to this exact reviewed
                      commit. Do NOT use `gh pr diff` for the diff itself — it
                      shows the PR's CURRENT live state, which may have moved
                      past the commit this review is pinned to and recorded
                      above. Instead compute the diff from the pinned local
                      checkout against the PR's ACTUAL base commit (not a
                      guessed main/master — this PR may target a release,
                      backport, or stacked branch):
                      `git -C pr-head diff ${{ steps.gate.outputs.base_sha }} HEAD`,
                      then read files under ./pr-head/ as needed. `gh pr
                      view`/`gh pr comment`/`gh pr review` (metadata/posting,
                      not diffing) are fine via the API as normal. Do not
                      execute, source, or `cd` into running anything from
                      ./pr-head/scripts/ or similar — read it, don't run it.

                      Review this pull request for heavygee/hapi, a fork of
                      tiann/hapi (terminal coding-agent session manager).

                      Base focus:
                      1. Correctness — logic bugs, edge cases, regressions
                      2. Security — injection, auth, secrets, unsafe defaults
                      3. Tests — meaningful coverage for changed behavior
                      4. Scope — minimal diff; flag unrelated churn

                      Read AGENTS.md and docs/operator/AGENTS.md (at the
                      workspace root — trusted) when present for project
                      conventions. Post inline comments on specific lines.

                      Submit a formal pull request review with a summary.
                      REQUEST_CHANGES is MANDATORY if you found ANY blocking
                      issue — a real bug, a security problem, a missing test
                      for materially changed behavior — even one. Use COMMENT
                      ONLY when you found nothing blocking; do not put a real
                      finding only in the summary text while leaving the
                      review state as COMMENT — downstream automation
                      (hapi-pr-status.sh) treats COMMENT as "no blocking
                      findings" by construction, so the review STATE itself,
                      not just the prose, must be accurate. Do not APPROVE or
                      merge under any circumstances.
                  # Narrower than lockhouse/arthur's allowedTools (cold review,
                  # 2026-10-15): arthur reviews internal/trusted PRs; this
                  # workflow exists specifically to review EXTERNAL fork PRs
                  # whose diff/comments are adversarial by assumption. Bare
                  # `Bash(gh pr*)`/`Bash(gh api*)`/`Bash(git*)` would let a
                  # prompt-injection in the reviewed content reach `gh pr merge`,
                  # `gh pr close`, `gh pr edit`, or an arbitrary `gh api` call
                  # with this job's pull-requests:write token. The prompt's "do
                  # not approve/merge" instruction is the only defense for
                  # whatever's still reachable through `gh pr review:*` — this
                  # list exists to shrink that surface, not eliminate it.
                  #
                  # Read/Glob/Grep/LS are explicitly path-scoped to `./*` (cold
                  # review, 2026-10-15, fourth wave) — bare `Read` etc. can read
                  # ANY absolute path the OS user can read, not just the project
                  # tree (verified empirically: bare Read successfully read a
                  # file outside the working directory; /proc/self/environ
                  # specifically is blocked by the tool as a device-like file,
                  # but ordinary files elsewhere on the runner are not). This
                  # self-hosted runner is PERSISTENT, not a fresh container per
                  # job — unscoped Read could reach other repos' checkouts,
                  # cached credentials, or anything else the runner's OS user
                  # can see. `(./*)` was verified to still permit reading both
                  # the trusted root and ./pr-head (a subdirectory of the same
                  # workspace) while blocking absolute paths outside it.
                  claude_args: |
                      --max-turns 80
                      --add-dir pr-head
                      --allowedTools "Read(./*),Glob(./*),Grep(./*),LS(./*),mcp__github_inline_comment__create_inline_comment,mcp__github_comment__update_claude_comment,Bash(git -C pr-head*),Bash(gh pr comment:*),Bash(gh pr view:*),Bash(gh pr review:*)"

            # Says plainly which of the three outcomes happened: checkout
            # failure, review failure, or a real completed review — collapsing
            # any of these into the same red/green signal is the exact
            # "did not run" vs "found nothing" confusion this workflow exists
            # to avoid (cold review, 2026-10-15: checkout failing was
            # originally NOT advisory, contradicting that same goal).
            #
            # A successful action outcome only proves the Claude Code process
            # exited 0 — in agent mode nothing enforces that it actually
            # called `gh pr review`. Query for the tip-matched marker itself
            # as the real postcondition for "completed" (cold review,
            # 2026-10-15, second wave), same query shape as the gate step.
            - name: Verify a formal review was actually posted
              id: verify
              if: always() && steps.gate.outputs.run == 'true' && steps.checkout_base.outcome == 'success' && steps.checkout_head.outcome == 'success'
              env:
                  GH_TOKEN: ${{ github.token }}
                  REPO: ${{ github.repository }}
                  PR_NUMBER: ${{ steps.gate.outputs.pr_number }}
                  HEAD_SHA: ${{ steps.gate.outputs.head_sha }}
              run: |
                  set -uo pipefail
                  REVIEWS_JSON=$(gh api "repos/$REPO/pulls/$PR_NUMBER/reviews" --paginate --slurp 2>/dev/null || echo '[]')
                  POSTED=$(printf '%s' "$REVIEWS_JSON" | jq --arg sha "${HEAD_SHA:0:12}" '
                      def pages: if type == "array" and length > 0 and (.[0]|type) == "array" then add else . end;
                      (. | pages // [])
                      | [.[] | select(.user.login == "github-actions[bot]"
                          and ((.body // "") | test("Claude Fallback Review"; "i"))
                          and ((.body // "") | contains($sha)))] | length
                      ' 2>/dev/null || echo 0)
                  echo "posted=${POSTED:-0}" >>"$GITHUB_OUTPUT"

                  # This workflow's own "never APPROVE" rule means the normal way
                  # a reviewer clears their own prior CHANGES_REQUESTED (approving
                  # it away) is permanently unavailable to this bot — a COMMENT
                  # review does NOT supersede an earlier actionable review from
                  # the same identity (GitHub docs: Comment "neither approves nor
                  # requests changes"). Without this, a REQUEST_CHANGES run
                  # followed by a later clean run would leave the PR permanently
                  # blocked on a stale decision only a human or explicit API
                  # dismissal can clear (cold review, 2026-10-15, third wave).
                  # Only act when THIS run's own review is clean — never dismiss
                  # on a failed/unverified run.
                  if [[ "${POSTED:-0}" -gt 0 ]]; then
                      THIS_STATE=$(printf '%s' "$REVIEWS_JSON" | jq -r --arg sha "${HEAD_SHA:0:12}" '
                          def pages: if type == "array" and length > 0 and (.[0]|type) == "array" then add else . end;
                          (. | pages // [])
                          | [.[] | select(.user.login == "github-actions[bot]"
                              and ((.body // "") | test("Claude Fallback Review"; "i"))
                              and ((.body // "") | contains($sha)))]
                          | sort_by(.submitted_at) | reverse | .[0].state // empty
                          ' 2>/dev/null)
                      if [[ "$THIS_STATE" == "COMMENTED" ]]; then
                          STALE_IDS=$(printf '%s' "$REVIEWS_JSON" | jq -r --arg sha "${HEAD_SHA:0:12}" '
                              def pages: if type == "array" and length > 0 and (.[0]|type) == "array" then add else . end;
                              (. | pages // [])
                              | [.[] | select(.user.login == "github-actions[bot]"
                                  and ((.body // "") | test("Claude Fallback Review"; "i"))
                                  and (((.body // "") | contains($sha)) | not)
                                  and .state == "CHANGES_REQUESTED")]
                              | .[].id
                              ' 2>/dev/null)
                          for id in $STALE_IDS; do
                              echo "Dismissing stale Claude Fallback Review $id (superseded by clean review on $HEAD_SHA)"
                              gh api -X PUT "repos/$REPO/pulls/$PR_NUMBER/reviews/$id/dismissals" \
                                  -f "message=Superseded by a clean Claude Fallback Review on ${HEAD_SHA:0:12} — prior findings addressed." \
                                  -f "event=DISMISS" >/dev/null 2>&1 || echo "::warning::Failed to dismiss stale review $id — may need manual dismissal."
                          done
                      fi
                  fi

            - name: Report whether the review actually ran
              if: always() && steps.gate.outputs.run == 'true'
              env:
                  CHECKOUT_BASE_OUTCOME: ${{ steps.checkout_base.outcome }}
                  CHECKOUT_HEAD_OUTCOME: ${{ steps.checkout_head.outcome }}
                  CLAUDE_REVIEW_OUTCOME: ${{ steps.claude_review.outcome }}
                  POSTED_COUNT: ${{ steps.verify.outputs.posted }}
              run: |
                  if [[ "$CHECKOUT_BASE_OUTCOME" != 'success' || "$CHECKOUT_HEAD_OUTCOME" != 'success' ]]; then
                      {
                          echo "### :warning: The Claude fallback review did NOT run (checkout failed)"
                          echo
                          echo "base checkout: \`$CHECKOUT_BASE_OUTCOME\`, PR-head checkout:"
                          echo "\`$CHECKOUT_HEAD_OUTCOME\`. Advisory only — does not block merges,"
                          echo "but **nothing here says the diff is fine**."
                      } >>"$GITHUB_STEP_SUMMARY"
                      echo "::warning title=Claude fallback review did not run::Checkout failed (base=$CHECKOUT_BASE_OUTCOME, head=$CHECKOUT_HEAD_OUTCOME) — Codex quota-exhausted AND the fallback also failed before it could review anything."
                  elif [[ "${POSTED_COUNT:-0}" -gt 0 ]]; then
                      echo "Claude fallback review completed (verified: a tip-matched review was posted)." >>"$GITHUB_STEP_SUMMARY"
                  else
                      {
                          echo "### :warning: The Claude fallback review did NOT produce a posted review"
                          echo
                          echo "Action outcome: \`$CLAUDE_REVIEW_OUTCOME\`, but no tip-matched"
                          echo "\"Claude Fallback Review\" was found on the PR — a successful process exit"
                          echo "does not by itself prove \`gh pr review\` was actually called. This job is"
                          echo "advisory and does not block merges. **Nothing here says the diff is fine**"
                          echo "— Codex is out of quota AND this fallback also failed to produce a review."
                          echo
                          echo "If the action outcome above was also non-success, most likely"
                          echo "CLAUDE_CODE_OAUTH_TOKEN has lapsed (tied to a Claude Code account;"
                          echo "re-run \`claude setup-token\` and update the repo secret)."
                      } >>"$GITHUB_STEP_SUMMARY"
                      echo "::warning title=Claude fallback review did not run::No tip-matched review found (action outcome: $CLAUDE_REVIEW_OUTCOME) — Codex quota-exhausted AND the fallback also failed to produce a verified review; this PR has no automated review right now."
                  fi
