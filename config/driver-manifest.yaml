  #   - includes a dedup-by-reference fix: applySessionPatch MUTATES the
  #     cached Session in place; snapshot metadata before the call so the
  #     dedup-on-agent-session-id-change trigger still fires on the fast path.
  # No SCHEMA_VERSION bump. Pre-PR; gates green (429 hub tests pass).
  - branch: feat/sse-patch-extend-session-state

